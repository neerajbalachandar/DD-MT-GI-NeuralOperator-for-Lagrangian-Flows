seed: 42
device: auto

# Default to controlled one-step leapfrogging pretraining. For long-horizon
# optimization after this checkpoint exists, use configs/leapfrogging_rollout.yaml.
data:
  dataset: processed_data/leapfrogging/particle_evolution_dataset.npz
  merged_frames: processed_data/leapfrogging/merged_frames
  native_task2_root: datagen_code/training_data
  allow_missing_native_task2: false
  input_features: [u_x, u_y, u_z, sigma, Gamma_x, Gamma_y, Gamma_z, gradU_xx, gradU_xy, gradU_xz, gradU_yx, gradU_yy, gradU_yz, gradU_zx, gradU_zy, gradU_zz, delta_t]
  global_condition_channels: [freestream_magnitude, phase]
  max_particles: 2048
  # Supervise every node of the native 32^3 Eulerian field grid.
  max_queries: 32768

preprocessing:
  max_rss_gb: 32

# Preserve the shared-latent GNO-FNO model architecture for the controlled baseline.
model:
  latent_res: 16
  hidden_channels: 128
  fno_layers: 6
  fno_modes: 6
  gno_radius: 0.15
  mlp_layers: 3
  mlp_hidden: 128
  query_pos_encoding_frequencies: 4
  use_attention: true
  use_skip: true
  use_global_conditioning: true
  use_task_adapters: true
  predict_delta_u: true

training:
  run_dir: runs/leapfrogging_pretrain_fieldbalanced
  epochs: 120
  batch_size: 1
  gradient_accumulation_steps: 1
  dataloader_num_workers: 8
  validation_every_n_epochs: 1
  learning_rate: 0.00005
  weight_decay: 0.00003
  scheduler: plateau
  # The saved runs averaged pre-clip norms around 9-11, so 0.5 clipped nearly
  # every update. A 5.0 cap retains stability without shrinking updates so hard.
  grad_clip_norm: 5.0
  early_stopping_patience: 30
  mixed_precision: false
  use_state_loss: true
  use_field_loss: true
  # Fixed task weights keep a learned uncertainty weight from hiding weak field fit.
  use_homoscedastic_weighting: false
  state_loss_weight: 1.0
  field_loss_weight: 2.0
  # Field target channels are [u(0:3), grad(u)(3:12), omega(12:15)].
  field_velocity_weight: 1.0
  field_gradient_weight: 1.0
  field_vorticity_weight: 1.0
  use_relative_l2_field_loss: true
  use_rollout_loss: false
  use_pushforward: false
  use_scheduled_sampling: false
  use_gns_noise: false
  rollout_weight: 0.0
  pushforward_weight: 0.0
  rollout_horizon_max: 1
  rollout_horizon_schedule: [1]

evaluation:
  checkpoint: ""
  split: test
  rollout_horizons: [1, 4, 8, 16, 32, 64, 180]
  rollout_starts_per_case: 5
  max_batches: 0
  allow_missing_native_task2: true
  save_plots: true
  save_full_fields: true
  save_full_rollout_fields: true
  field_visual_phase: 0.5
  field_visual_phases: [0.1, 0.3, 0.5, 0.7, 0.9]
  field_plane_mode: highest_energy
  save_parity_plots: true
  field_y_plane: 0.0
  reference_chord: null
  reference_leading_edge_x: null
  profile_x_over_c: [0.2, 0.4, 0.6]
