seed: 42
device: auto
data:
  dataset: processed_data_vpm/particle_evolution_dataset.npz
  native_task2_root: "/media/dysco/New Volume/Neeraj/NeuralOp_FLOWVPM_Data"
  allow_missing_native_task2: false
  # Vortex-only data has no solid-body distance, normal, or near-body features.
  input_features: [u_x, u_y, u_z, sigma, Gamma_x, Gamma_y, Gamma_z, gradU_xx, gradU_xy, gradU_xz, gradU_yx, gradU_yy, gradU_yz, gradU_zx, gradU_zy, gradU_zz, delta_t]
  global_condition_channels: [freestream_magnitude, phase]
  max_particles: 2048
  max_queries: 32768

preprocessing:
  max_rss_gb: 0
  rollout_memory_cap_gb: 2.0
  
model:
  latent_res: 16
  hidden_channels: 128
  fno_layers: 6
  fno_modes: 6
  gno_radius: 0.15
  mlp_layers: 3
  mlp_hidden: 128
  query_pos_encoding_frequencies: 4
  use_attention: true
  use_skip: true
  use_global_conditioning: true
  use_task_adapters: true
  predict_delta_u: true

training:
  run_dir: runs/
  epochs: 120
  batch_size: 1
  gradient_accumulation_steps: 4
  dataloader_num_workers: 8
  validation_every_n_epochs: 1
  # Stability-first defaults: full precision avoids the complex-gradient autocast issue
  # noted in the project review, while the lower LR reduces rollout drift.
  learning_rate: 0.0001
  weight_decay: 0.00003
  scheduler: plateau
  grad_clip_norm: 0.5
  early_stopping_patience: 30
  mixed_precision: false
  use_state_loss: true
  use_field_loss: true
  use_rollout_loss: true
  rollout_weight: 0.1
  # The current tracked sequences support at most four consecutive steps.
  rollout_horizon_max: 4
  rollout_horizon_schedule: [2, 2, 3, 3, 4, 4, 4, 4, 4, 4]
  pushforward_weight: 0.0
  use_scheduled_sampling: true
  scheduled_sampling_max_probability: 0.2
  scheduled_sampling_ramp_epochs: 12
  use_gns_noise: true
  gns_initial_std: 0.005
  gns_walk_std: 0.0025
  use_pushforward: false
  use_homoscedastic_weighting: true
  state_loss_weight: 1.0
  field_loss_weight: 1.0
  use_relative_l2_field_loss: true
evaluation:
  checkpoint: ""
  split: test
  rollout_horizons: [1, 2, 4]
  max_batches: 0
  allow_missing_native_task2: true
  save_plots: true
  field_visual_phase: 0.5
  field_visual_phases: [0.1, 0.3, 0.5, 0.7, 0.9]
  field_plane_mode: highest_energy
  save_parity_plots: true
  field_y_plane: 0.0
  reference_chord: null
  reference_leading_edge_x: null
  profile_x_over_c: [0.2, 0.4, 0.6]
