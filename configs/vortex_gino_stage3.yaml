# Stage 3: long-horizon stabilisation fine-tune, initialised from the joint checkpoint of
# configs/vortex_gino.yaml (scripts/train_vortex.py --config configs/vortex_gino_stage3.yaml --init <ckpt>).
# Adds on-policy training: the EMA model is rolled out from random training frames and the operator
# is supervised on the states it visits, with exact regularised Biot-Savart targets (the field the
# VPM solver itself would compute for those particles).  This removes the circulation feedback
# instability (sum|Gamma| growing exponentially after ~50 steps) that short BPTT windows cannot see.
seed: 1
device: auto
data:
  root: processed_data/vortex_rings_v2
  train_cases: []
  val_cases: []
model:
  box_half_extent: [2.8, 2.8, 3.3]
  latent_resolution: [24, 24, 28]
  hidden_channels: 64
  encoder_channels: 32
  encoder_hidden: 64
  fno_modes: [12, 12, 14]
  fno_layers: 4
  domain_padding: 0.25
  query_fourier_frequencies: 3
  substeps: 2
  gamma_dynamics: rate
  relaxation: {enabled: true, rlxf: 0.3, per_interval: 4}   # FLOWVPM corrected-Pedrizzetti, 4 solver steps per saved interval
  decoder_hidden: 128
  decoder_layers: 3
  near_field: {enabled: true, channels: 4, rbf: 12, cutoff: 0.3, rho_max: 4.0}
training:
  run_dir: runs/vortex_gino_stage3
  epochs: 12
  operator_epochs: 0
  steps_per_epoch: 200
  frames_per_step: 4
  learning_rate: 0.0002
  ema_decay: 0.998
  min_lr_ratio: 0.05
  warmup_steps: 100
  weight_decay: 0.00001
  grad_clip_norm: 10.0
  grid_queries: 8192
  particle_queries: 1024
  integrator: rk4
  dynamics_probability: 0.5
  dynamics_weight: 1.0
  rollout_horizon_schedule: [[0, 2], [5, 3], [9, 4]]
  loss_weights: {grid_u: 1.0, grid_w: 0.5, particle_u: 1.0, particle_J: 0.5, gamma_rate: 1.0, step_x: 1.0, step_gamma: 0.3}
  grid_sampling_fractions: [0.5, 0.35, 0.15]
  near_particle_distance: 0.5
  augmentation: {probability: 0.1, position_std_over_sigma: 0.3, gamma_rel_std: 0.05}
  onpolicy: {probability: 0.35, refresh_every: 10, max_steps: 120, buffer_size: 64, max_gamma_drift: 0.6}
  val_frames: [10, 50, 90, 130, 170]
  val_rollout_steps: 100
  val_rollout_start: 20
  val_rollout_max_particles: 3000
