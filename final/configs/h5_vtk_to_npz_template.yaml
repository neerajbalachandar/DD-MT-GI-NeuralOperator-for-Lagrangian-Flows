# Template config to merge split INPUT/OUTPUT H5 streams (+ optional XMF/VTK)
# into unified NPZ frames for multiple datasets.
#
# Run from repo root:
#   python -m final.h5_vtk_to_npz \
#     --config final/configs/h5_vtk_to_npz_template.yaml \
#     --root "/media/dysco/New Volume/Neeraj/neuralop/data/raw data"

output_dir: final/output/merged_npz

# How to extract numeric frame id from filenames (trailing integer by default)
frame_id_regex: "(\\d+)(?!.*\\d)"

# Pairing between input and output frames:
# - intersection: require same frame id in both
# - nearest_prev: for each input frame, choose latest output frame <= input
pair_mode: intersection

# Global key maps from your XMF/H5 structure
# (top-level H5 datasets: X, Gamma, velocity, velocity_gradient_x/y/z, vorticity,
#  sigma, circulation, vol, static, nodes, U, W)
input_key_map:
  particle_xyz: "X"
  Gamma_vec: "Gamma"
  velocity: "velocity"
  velocity_gradient_x: "velocity_gradient_x"
  velocity_gradient_y: "velocity_gradient_y"
  velocity_gradient_z: "velocity_gradient_z"
  vorticity: "vorticity"
  sigma: "sigma"
  circulation: "circulation"
  vol: "vol"
  static: "static"

output_key_map:
  points: "nodes"
  U: "U"
  W: "W"

# Multiple datasets supported.
# IMPORTANT: input uses `wing-example_pfield.*` only (not `*`) to avoid staticpfield
# files overriding frame IDs during pairing.
datasets:
  - name: "1"
    output_subdir: "1"
    input_h5_glob: ["1/input/wing-example_pfield.*.h5"]
    output_h5_glob: ["1/output/wing-example_fdom.*.h5"]
    input_xmf_glob: ["1/input/wing-example_pfield.*.xmf"]
    output_xmf_glob: ["1/output/wing-example_fdom.*.xmf"]
    vtk_glob: ["1/vtk/wing-example_Wing_vlm.*.vtk"]
    pair_mode: intersection

  - name: "2"
    output_subdir: "2"
    input_h5_glob: ["2/input/wing-example_pfield.*.h5"]
    output_h5_glob: ["2/output/wing-example_fdom.*.h5"]
    input_xmf_glob: ["2/input/wing-example_pfield.*.xmf"]
    output_xmf_glob: ["2/output/wing-example_fdom.*.xmf"]
    vtk_glob: ["2/vtk/wing-example_Wing_vlm.*.vtk"]
